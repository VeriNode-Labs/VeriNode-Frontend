[package]
name = "verinode-desktop"
version = "0.1.0"
edition = "2021"
description = "VeriNode Labs verifiable data analytics and proof anchoring desktop client"

[lib]
name = "verinode_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "=2.2.0"

[features]
custom-protocol = ["tauri/custom-protocol"]